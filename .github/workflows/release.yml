name: release

# 推 tag（v0.1.0 之类）→ 校验版本号一致 → 复用 desktop-windows.yml 的 verify + package →
# 生成 SHA256 → 建 GitHub Release 并附上安装包与校验值。
#
# **只认 tag 推送，不做 workflow_dispatch**：手动触发时 checkout 的是 main 的代码，
# 而发布必须发「那个 tag 的代码」。两者一混，就会出现「tag 标 v0.2.0、装出来是 main 上
# 未发布的改动」这种最难发现的错误。要重跑某次发布，直接 Rerun 那个 tag 的 workflow。
#
# **为什么发布单独一个文件**：desktop-windows.yml 是「验证门槛」，每次 push 都跑；
# 发布是低频、有副作用（建 Release、留下永久产物）的动作，混在一起会让
# 「CI 有没有坏」和「有没有发版」互相干扰。这里只做发布特有的三件事：
# 版本号校验、校验和、Release 正文。
#
# **签名现状（2026-11-02 决定：不签名）**：这不是省事，是权衡后的结论——
#   - 自签名证书对 SmartScreen **完全无效**。微软文档原话："Self-signed Certificate
#     ⚠️ Warning — Same behavior as no signature"。
#     来源：https://learn.microsoft.com/en-us/windows/apps/package-and-deploy/smartscreen-reputation
#   - **EV 证书也已不再绕过** SmartScreen（同一文档："EV certificates no longer bypass
#     SmartScreen"），所以「买贵证书换干净安装」这条路已经不存在了。
#   - 剩下的只有 OV / Azure Artifact Signing（$9.99/月起，且首年仍要攒信誉）
#     或上架 Microsoft Store（免费零警告，但要过审）。
# 所以现在是：不签名 + 公开 SHA256 + 在 Release 正文里讲清楚会发生什么。
# 真有人问「为什么有警告」时，再按上面的选项决定要不要花钱。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # 建 Release 需要写

concurrency:
  group: release-${{ github.ref }}
  # 发布不做「新推送取消上一轮」：发包到一半被掐会留下残缺 Release
  cancel-in-progress: false

jobs:
  check:
    name: check version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match package.json and pyproject.toml
        id: v
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag 必须是 vX.Y.Z 形式，实际：$TAG"; exit 1 ;;
          esac
          VER="${TAG#v}"
          # 预发布后缀（-rc.1 / -beta.2）不算在版本号里：package.json 里的 version 是
          # "0.1.0"，pre-release 只是 tag 上的标记。否则为了发一个 rc 就得改产品版本号，
          # 而那个版本号会进入安装包和更新器，那才是真错。
          BASE="${VER%%-*}"
          PKG=$(node -p "require('./desktop/package.json').version")
          PYW=$(python3 - <<'PY'
          import re, pathlib
          t = pathlib.Path('ee/pyproject.toml').read_text(encoding='utf-8')
          m = re.search(r'^version\s*=\s*"([^"]+)"', t, re.M)
          print(m.group(1) if m else '')
          PY
          )
          echo "tag=$TAG version=$VER base=$BASE package.json=$PKG pyproject=$PYW"
          # 三者不一致时，更新器会永远重复下载同一个版本（latest.yml 声明的版本与
          # 已安装二进制上报的版本对不上），所以这必须硬失败而不是警告。
          [ "$BASE" = "$PKG" ] || { echo "tag 基础版本($BASE) 与 desktop/package.json($PKG) 不一致（tag=$TAG）"; exit 1; }
          [ "$BASE" = "$PYW" ] || { echo "tag 基础版本($BASE) 与 ee/pyproject.toml($PYW) 不一致（tag=$TAG）"; exit 1; }
          echo "version=$BASE" >> "$GITHUB_OUTPUT"

  build:
    name: build
    needs: check
    # 复用验证门槛：不在这里重写一套打包步骤。先 verify 再 package，
    # 与「手动勾选打包」走的是同一份逻辑，避免两条路径悄悄漂移。
    uses: ./.github/workflows/desktop-windows.yml
    with:
      package: true
    permissions:
      contents: read

  publish:
    name: publish
    needs: [check, build]
    runs-on: windows-latest
    timeout-minutes: 15
    # 显式写一遍：建 Release 必须 write。虽然顶层已有，但 publish 经过 reusable
    # workflow 一层，别让继承链成为下一个“说不清”的变量。
    permissions:
      contents: write
    steps:
      # **必须 checkout**：gh 解析仓库时如果既没有 -R 也没有可读的 git remote，
      # 会死在 `failed to run git: fatal: not a git repository`。只传 GH_REPO
      # 实测仍失败（v0.1.0-rc.1 第 4 轮，25 秒即挂），所以老老实实给个 .git。
      # 放在下载产物之前：checkout 会清理工作目录，反过来会把 dist-out 删掉。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # 带上 tag/历史，避免 gh 再去远程补数据

      - uses: actions/download-artifact@v7
        with:
          name: ee-windows-installer
          path: dist-out

      - uses: actions/download-artifact@v7
        with:
          name: ee-release-manifest
          path: dist-out/build-info

      - name: Compute SHA256
        shell: pwsh
        run: |
          $files = Get-ChildItem dist-out -Filter *.exe
          if (-not $files) { throw "没有找到安装包（上游 package 步骤失败？）" }
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($f.Name)"
          }
          # 无 BOM 的 UTF-8 + LF：SHA256SUMS 是给用户 shasum -c 用的，BOM 会让第一行校验失败
          $sumsText = ($lines -join "`n") + "`n"
          [System.IO.File]::WriteAllText("$PWD/dist-out/SHA256SUMS.txt", $sumsText, [System.Text.UTF8Encoding]::new($false))
          Get-Content dist-out/SHA256SUMS.txt

      - name: Build release notes
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $sums = (Get-Content dist-out/SHA256SUMS.txt -Raw).Trim()
          # 安装包文件名从实际产物读，不拼：预发布时它带 -v0.1.0-rc.1 后缀，
          # 硬拼成 ee-Setup-0.1.0.exe 会让用户找不到文件、没法校验。
          $exe = @(Get-ChildItem dist-out -Filter *.exe | Select-Object -First 1)
          if (-not $exe) { throw "没有找到安装包，无法生成正文" }
          $exeName = $exe[0].Name
          $exeVer = ($exeName -replace '^ee-Setup-', '') -replace '\.exe$', ''
          # 预发布时安装包名里是基础版本号（0.1.0），tag 后缀只存在于发布标记上，
          # 不说清楚会让人以为下错了。不改名是因为 latest.yml/.blockmap 内部引用的
          # 就是这个文件名，单改 exe 会把更新源指空。
          # 用单引号字符串 + 双重单引号拼：here-string 内不用反引号，免得又被转义坑。
          $verNote = ''
          if ($env:TAG -match '-') {
            $verNote = '（文件名里的版本是 ' + $exeVer + '，' + $env:TAG + ' 只是发布标记）'
          }
          # here-string 内不能直接写反引号包变量（`$x）：反引号是 PS 转义符，
          # 会把 $x 变成字面量（实测下载行输出成 "下载 $exeName"）。预先拼好再用。
          # 代码围栏同理：字面量 ``` 会被渲染成两个单反引号，用字符拼出来。
          $f = [string][char]96 * 3
          $dlLine = '下载 ' + $exeName + '。'
          $hashLine = 'Get-FileHash .\' + $exeName + ' -Algorithm SHA256'
          $body = @"
          ee $env:TAG（Windows x64 安装包）$verNote

          ## 安装
          1. $dlLine
          2. 首次运行会出现蓝色的「Windows 已保护你的电脑」。点 **更多信息** → **仍要运行**。
             这是**未签名**程序的正常提示，不是病毒告警，原因见下。
          3. 安装完启动 ee，在设置页填 API key（默认 DeepSeek）。

          ## 为什么会有 SmartScreen 提示
          本安装包**没有代码签名证书**。按微软文档，自签名证书与不签名在 SmartScreen 上
          表现**完全相同**，EV 证书也已不再绕过警告，所以「买个证书消掉提示」并不成立。
          要彻底消掉只有两条路：购买 OV / Azure Artifact Signing 并积累信誉（有年费、
          首年仍有提示），或上架 Microsoft Store（免费但需过审）。在积累起用户量之前，
          提示会一直在。

          ## 校验下载（推荐）
          在该文件所在目录运行：

          $f
          $hashLine
          $f

          输出应与下面一致；不一致说明文件在传输中被改动过，不要运行：

          $f
          $sums
          $f

          ## 系统要求
          Windows 10 / 11 x64，自备模型 API key（默认 DeepSeek，也支持 OpenAI 兼容中转站）。
          "@
          # 显式写无 BOM 的 UTF-8：GitHub 把以 BOM 开头的 Markdown 当正常文本，但无 BOM 更干净
          [System.IO.File]::WriteAllText("$PWD/dist-out/RELEASE_NOTES.md", $body, [System.Text.UTF8Encoding]::new($false))

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # **显式给仓库，不再靠推断**：gh 找不到 -R/GH_REPO 时会去读 git remote，
          # 没有 .git 就死在 `failed to run git: fatal: not a git repository`
          # （v0.1.0-rc.1 前两轮的失败点）。现在 checkout 与 GH_REPO 两手都上：
          # 一个给 .git，一个让 gh 不必猜。
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Continue'
          $tag = "${{ github.ref_name }}"
          $isPre = $tag -match '-'
          $pre = if ($isPre) { @("--prerelease") } else { @() }
          # 安装包 + latest.yml/.blockmap（更新源配套产物）+ 校验和
          $assets = @(Get-ChildItem dist-out -File | Where-Object { $_.Name -match '\.(exe|yml|blockmap)$' } | ForEach-Object { $_.FullName })
          $assets += "dist-out/SHA256SUMS.txt"

          # 先自检：失败一次已经白等半小时，宁可多打几行日志
          Write-Host "tag=[$tag] pre_flag=[$($pre -join ' ')]"
          Write-Host "assets($($assets.Count)):"
          $assets | ForEach-Object { Write-Host "  $_  $(if (Test-Path $_) {'存在'} else {'【缺失】'})" }
          $missing = @($assets | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) { throw "以下文件不存在，无法上传：$($missing -join ', ')" }
          Write-Host "gh 版本：$(& gh --version | Select-Object -First 1)"

          # 不用 --verify-tag：它同样要 shell out 到本地 git 去核对 tag。tag 一定存在
          # （本 workflow 就是由 tag 推送触发的），check 步骤还校验过 tag 与
          # pyproject/package.json 一致，这个校验是冗余的。
          #
          # **不能用 @pre / @assets（splat）**：实测 PowerShell 5.1 在 -File 模式下
          # 把 @pre 当成字面参数，而 @assets 会被逐字拆开传给 gh——gh 于是报
          # "no matches found for `-`"（那个 `-` 就是 `--prerelease` 被拆出来的第一段）。
          # 表现就是 check/verify/package 全绿、只挂在建 Release 这一步。
          # 改用数组拼接，参数边界清楚，不依赖 shell 的 splat 语义。
          $argv = @('release', 'create', $tag, '--repo', $env:GH_REPO,
                    '--title', "ee $tag", '--notes-file', 'dist-out/RELEASE_NOTES.md') + $pre + $assets
          Write-Host "gh 参数($($argv.Count))：$($argv -join ' ')"
          # 2>&1 + Tee-Object：日志只有仓库管理权限能看到，失败时必须自己留下现场。
          & gh @argv 2>&1 | Tee-Object -FilePath dist-out/gh-release.log
          $rc = $LASTEXITCODE
          if ($rc -ne 0) { Get-Content dist-out/gh-release.log; throw "gh release create 退出码 $rc" }

      # 失败时把 gh 的完整输出存成 artifact：工作流日志需要仓库管理权限，
      # 失败现场只有跑在 CI 上的这一份，不留下来就只能靠猜（已因此白等两轮）。
      - name: Save release log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-publish-log
          path: dist-out/gh-release.log
          if-no-files-found: ignore
