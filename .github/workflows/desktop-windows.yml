name: desktop-windows

# 验证与发布分开：
# - push main / pull_request / 手动（不勾打包）→ 只验证
# - 手动触发并勾选 package=true → 先完整验证，验证通过后才允许打包上传
#
# 仓库已公开（2026-10-30）：公开仓库的 GitHub Actions 永久免费，不受私有仓库
# 月度分钟数限制，因此恢复 push/pull_request 自动触发。
# 本地 scripts/verify.sh 保留，作为无网络/无额度时的等价入口。
on:
  push:
    branches: [main]
    paths:
      - "ee/**"
      - "desktop/**"
      - ".github/workflows/desktop-windows.yml"
  pull_request:
    paths:
      - "ee/**"
      - "desktop/**"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:
    inputs:
      package:
        description: "验证通过后构建并上传 Windows 安装包"
        type: boolean
        default: false
  # 供 release.yml 复用：发布流程不重写一套打包步骤，只在这里传 package=true。
  # 两条发布路径（手动勾选 / 推 tag）走同一份已验证的打包逻辑，避免两边漂移。
  workflow_call:
    inputs:
      package:
        description: "验证通过后构建并上传 Windows 安装包"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  # PR 分支：新推送取消上一轮（迭代快，旧结果没意义）。
  # main：**不取消**——Backend tests 要跑约 8 分钟，整轮 15-20 分钟；
  # 若连推两次就把上一轮掐掉，CI 永远跑不完，永远拿不到真结果
  # （实测 #117–#122 全是被取消，只有等够时间不推送的 #124 才绿）。
  # main 上宁可排队等一轮真结果，也不要一串「已取消」。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  verify:
    name: verify
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ee/pyproject.toml

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Python backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./ee[test]" ruff

      # 真实 LSP 用例（test_lsp_integration.py）只在 PATH 上有 pyright-langserver 时才跑，
      # 不装它这条唯一的「真实语言服务器」验收在 CI 里永远 skip；而 -rf 不列 skip，
      # 日志上与其他 16 个 skip 无法区分。这里装上，让门禁真的覆盖那一层。
      # 不用 npx 兜底：首次下载会超过 initialize 的 20 秒预算，把环境问题伪装成代码缺陷。
      - name: Install pyright (real LSP integration test)
        run: npm i -g pyright

      # 只跑 pyproject.toml 里 select 的那组「代码有误」规则（见 ee/pyproject.toml 注释）。
      # 它是廉价的硬指标：语法错 / 未定义名 / 未用导入与变量，一条 0.3 秒就能查完，
      # 放在 pytest 前面，坏代码不用等 7 分钟才报。
      - name: Backend lint
        working-directory: ee
        run: ruff check .

      - name: Backend tests
        id: backend-tests
        working-directory: ee
        timeout-minutes: 25
        # -rf 让尾部列出失败用例名；-rs 把跳过连同原因一起列出来
        # （没有 -rs 时，一条「该跑却被 skip 掉」的用例与正常跳过在日志上无法区分）；
        # --tb=short 保留足够定位的栈。
        run: python -m pytest -q -o faulthandler_timeout=150 -rf -rs --tb=short

      # 失败时把结果入 artifact：工作流日志需仓库管理权限才能下载，
      # 失败现场只有跑在 CI 上的这一份，不留下来就查不了。
      - name: Save test report
        if: ${{ failure() && steps.backend-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: ee/.pytest_cache/v/cache/lastfailed
          if-no-files-found: ignore

      - name: E2E with source backend (python -m ee serve)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        # 必须从 ee/ 里跑：从仓库根执行时 `ee` 会被解析成命名空间包（__file__ 是 None、
        # 没有 __version__），后端子进程 `-m ee` 启动即崩 ImportError。脚本现在会自检
        # 并在报错里指出正确目录，但把它放在正确目录里更好。
        working-directory: ee
        run: python scripts/e2e_ws.py python -m ee serve --exit-on-stdin-eof

      - name: Install desktop deps
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: npm ci

      # electron@45 的 package.json **没有** postinstall——二进制是在首次
      # `require('electron')` 时由 index.js 懒下载的（downloadElectron）。实测：
      # 2026-11-09 的一次 run 里 desktop 代码与上一次全绿 run 完全相同，12 个 spec
      # 却全部报 "Electron failed to install correctly"——懒下载在 E2E 进程里失败了，
      # 一次失败扩散成 12 个用例。E2E 之前显式触发并校验，让失败点落在这一步。
      - name: Verify Electron binary
        if: ${{ !cancelled() }}
        working-directory: desktop
        shell: pwsh
        run: |
          # 实测（2026-11-09）：GitHub release CDN 对 electron-v45.0.0-win32-x64.zip
          # 连续返回 504，懒下载失败后一次扩散成 12 个 spec 报错。重试 3 次，
          # 短暂抖动不至于打红整轮；仍失败则在这一步明确失败，不再伪装成用例失败。
          $exe = "node_modules/electron/dist/electron.exe"
          for ($i = 1; $i -le 3; $i++) {
            if (Test-Path $exe) { break }
            Write-Host "Electron 二进制缺失（第 $i 次尝试），运行 install.js 下载…"
            node node_modules/electron/install.js
            if (Test-Path $exe) { break }
            if ($i -lt 3) { Start-Sleep -Seconds 15 }
          }
          if (-not (Test-Path $exe)) { throw "Electron binary still missing after 3 attempts: $exe" }
          node -e "console.log('electron:', require('electron'))"

      - name: Frontend unit tests (vitest)
        if: ${{ !cancelled() }}
        working-directory: desktop
        timeout-minutes: 15
        run: npm test

      - name: Typecheck (renderer + electron)
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: npm run typecheck

      - name: Smoke-test node-pty (ConPTY prebuild, N-API)
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: node scripts/pty-smoke.cjs

      - name: Build renderer + electron main
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: npm run build

      # 必须放在 build 后面：Electron 加载的是 dist/，不重建就测的是旧代码。
      # 这一步长期缺席（只在本地手动跑），于是「所有 spec 没隔离用户目录」这种
      # 会改用户真实配置的缺陷在仓库里静默活了很久——没人跑，就没人发现。
      #
      # 为什么走 `npm run test:ui:guard` 而不是直接 `npx playwright test`：
      # playwright 的 timeout / globalTimeout 都是 JS 定时器，Electron 进程挂死时事件
      # 循环停摆，它们自己也不再被调度。实测两次：一次卡 44 分钟（把 verify 拖过 45
      # 分钟 job 上限而 cancelled，package/publish 全 skipped），一次卡 50 分钟仍
      # in_progress，且步骤级 `timeout-minutes: 15` 与 job 级 45 分钟都没把它杀掉。
      # e2e-watchdog.mjs 把等待放在**父进程**上（它不跟着子进程卡死），到点
      # taskkill /F /T 杀掉整棵进程树后以 124 退出，保证这里能看到结论。
      - name: E2E with real Electron (Playwright)
        if: ${{ !cancelled() }}
        working-directory: desktop
        timeout-minutes: 18
        run: npm run test:ui:guard

  package:
    name: package
    # 手动勾选打包，或被 release.yml 以 workflow_call 叫起时打包；两种都要求同一提交的 verify 先绿。
    # 用 `== true` 而不是裸布尔 `inputs.package`：push/pull_request 触发时没有这个 input
    # （undefined），显式比较能保证那两种情况下一定不打包。
    if: ${{ inputs.package == true }}
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ee/pyproject.toml

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install backend + PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./ee[test]" pyinstaller ruff

      - name: Record resolved dependencies (release manifest)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-info | Out-Null
          python -m pip freeze --all | Out-File -Encoding utf8 build-info/python-freeze.txt
          git rev-parse HEAD | Out-File -Encoding utf8 build-info/commit.txt

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Record desktop dependency tree
        working-directory: desktop
        shell: pwsh
        run: npm ls --all --json | Out-File -Encoding utf8 ../build-info/npm-ls.json

      - name: Build renderer + electron main
        working-directory: desktop
        run: npm run build

      - name: Build backend (PyInstaller onedir)
        working-directory: desktop
        env:
          EE_PYTHON: python
        run: node scripts/build-backend.mjs

      - name: Smoke-test packaged backend
        working-directory: desktop
        shell: pwsh
        run: |
          $exe = "resources/backend/ee-backend/ee-backend.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $env:EE_SERVE_TOKEN = "ci-smoke"
          $p = Start-Process -FilePath $exe -ArgumentList "serve","--port","0" -RedirectStandardOutput out.txt -RedirectStandardError err.txt -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            if ((Test-Path out.txt) -and (Select-String -Path out.txt -Pattern "EE_SERVE_READY" -Quiet)) { $ok = $true; break }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Content out.txt, err.txt -ErrorAction SilentlyContinue
          Remove-Item out.txt, err.txt -ErrorAction SilentlyContinue
          if (-not $ok) { throw "backend did not print EE_SERVE_READY" }

      - name: Packaged backend selftest (openai/httpx/certifi/encodings)
        working-directory: desktop
        run: resources/backend/ee-backend/ee-backend.exe selftest --secrets

      - name: E2E with packaged backend (fake model, stdin pipe + git workspace)
        timeout-minutes: 5
        run: python ee/scripts/e2e_ws.py desktop/resources/backend/ee-backend/ee-backend.exe serve --exit-on-stdin-eof

      - name: E2E with packaged backend (black-hole endpoint must time out with an error)
        timeout-minutes: 5
        run: python ee/scripts/e2e_ws.py --blackhole desktop/resources/backend/ee-backend/ee-backend.exe serve --exit-on-stdin-eof

      - name: Package NSIS installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --publish never

      - name: Check node-pty is packaged outside asar
        working-directory: desktop
        shell: pwsh
        run: |
          $d = "release/win-unpacked/resources/node-pty"
          foreach ($f in "lib/index.js", "prebuilds/win32-x64/conpty.node", "prebuilds/win32-x64/pty.node", "prebuilds/win32-x64/conpty/OpenConsole.exe") {
            if (-not (Test-Path "$d/$f")) { Get-ChildItem -Recurse $d -ErrorAction SilentlyContinue | Select-Object -First 50 FullName; throw "missing $d/$f" }
          }
          Write-Host "node-pty packaged OK"

      - uses: actions/upload-artifact@v7
        with:
          name: ee-windows-installer
          # 不只 .exe：electron-builder 同时产出 latest.yml（更新清单）与 .blockmap（差分补丁），
          # 它们和安装包是同一个版本的配套产物，少了就不是一个完整的更新源。
          path: |
            desktop/release/*.exe
            desktop/release/*.yml
            desktop/release/*.blockmap
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: ee-release-manifest
          path: build-info/**
          if-no-files-found: error
