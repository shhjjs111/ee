family = "qwen"
match = ["qwen", "qwq"]
context_window = 131072
max_output = 16384
parallel_tools = true
vision = false
reasoning = true
reasoning_passback = "none"
edit_style = "edit"
prompt_patch = "qwen"
empty_assistant_content = "empty"
quirks = ["xml_tool_calls", "json_tool_calls"]
# 思考开关与推理强度（官方文档 https://platform.qianwenai.com/docs/developer-guides/text-generation/thinking）：
# - enable_thinking = true / false（混合思考模式；部分模型是纯思考模式，关不掉）。
# - reasoning_effort 控制推理力度，取值按模型而异：qwen3.8-max 是 **low / medium / xhigh**（默认 xhigh）。
#   注意它**没有 high**——发 high 是非法值，会 400。
#   另有 thinking_budget 按 token 数限制思考长度，但两者不能同时传（会报错），ee 只发前者。
# - 所以这里只给 low / medium / max 三档，最高档发 xhigh。
#   旧版记住的 high 用 effort_aliases 落到 max（high 本来就在 medium 与 xhigh 之间，没有对应档）。
#   旧模型（qwen-plus/flash 等）不认这个参数，400 后 openai_chat 会自动去掉并记住。
thinking_param = "enable_thinking"

# Qwen3.8 系列：官方明确可选 low / medium / xhigh，默认就是 xhigh
# （文档 https://platform.qianwenai.com/docs/api-reference/chat/openai-chat 的 reasoning_effort 一节）。
# 默认已是最高档，所以「默认」档要写清楚，否则用户以为「默认 → 最高」还升了一级。
[[variants]]
match = ['re:qwen3\.8', 'qwen-3\.8']
effort_param = "reasoning_effort"
effort_levels = ["low", "medium", "max"]
effort_values = { max = "xhigh" }
effort_aliases = { high = "max" }
effort_labels = { "" = "默认（已是最高档）", max = "最高（xhigh）" }

# 其余 Qwen3.x：官方只说「不同模型支持的可选值和默认值不同」，没有逐一列出。
# 沿用 3.8 的三档（缺省值原样发 low/medium/xhigh），模型不认时由 400 降级重试兜住；
# 但不写「默认已是最高档」——那只对 3.8 有官方依据。
[[variants]]
match = ["re:qwen3", "qwen-3"]
effort_param = "reasoning_effort"
effort_levels = ["low", "medium", "max"]
effort_values = { max = "xhigh" }
effort_aliases = { high = "max" }
effort_labels = { max = "最高（xhigh）" }
