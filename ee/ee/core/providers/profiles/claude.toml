family = "claude"
match = ["claude"]
context_window = 200000
max_output = 32000
parallel_tools = true
vision = true
reasoning = false
reasoning_passback = "none"
edit_style = "edit"
prompt_patch = "default"
empty_assistant_content = "empty"
quirks = []

# 推理强度：**内置档案里不配**，原因见下（2026-11 查官方文档确认）。
#
# 原生 Messages API 确实有 output_config.effort（low/medium/high/xhigh/max，自适应思考模型
# 支持到 xhigh/max）。但 ee 只走 OpenAI Chat Completions 协议，而 Anthropic 的 OpenAI
# 兼容层文档（https://platform.claude.com/docs/en/api/openai-sdk）里：
#   - 字段支持表把 `reasoning_effort` 明确列为 **Ignored**；
#   - 表里根本没有 `output_config`；
#   - 文档原话「Most unsupported fields are silently ignored rather than producing errors」。
# 也就是说，把 output_config.effort 放进 extra_body 会被**静默丢弃**：不报错，所以
# openai_chat 的 400 降级重试永远不会触发，用户看到"已设为最高档"而实际行为毫无变化。
# 这是最坏的一种情况（假装生效），所以宁可置灰。
#
# 兼容层提供的思考控制只有 thinking:{type:"enabled", budget_tokens:N}，而且它**不返回**
# Claude 的思考内容（原生 API 才返回）。按 token 数调深度与 ee 的档位模型也不是一回事，
# 所以不接。
#
# 后路：如果 Claude 是通过自建中转/网关接入的，而那个网关真的支持 reasoning_effort，
# 可以在 ~/.ee/config.toml 里按模型覆盖（resolve_model 会把模型表里的字段并进档案）：
#
#   [models.my-claude]
#   provider = "claude"
#   model = "claude-opus-5-5"
#   effort_param = "reasoning_effort"
#   effort_levels = ["low", "medium", "high", "max"]
