# DeepSeek V4 系（deepseek-flash / deepseek-v4-pro）。价格按官方峰时价（元/百万 token，2026-10-25 官网），请以官网为准。
# 顶层 [price] 是 flash；pro 在 [[variants]] 里覆盖。
family = "deepseek"
match = ["deepseek"]
context_window = 1000000
max_output = 64000
request_max_tokens = 64000
parallel_tools = true
# deepseek-flash（V4.1-Flash）支持图片输入（官方 Vision 文档 2026-10）；deepseek-v4-pro 不支持，见下方 variants
vision = true
reasoning = true
# 带工具调用的助手轮次始终回传 reasoning_content（缺失补 ""）；纯文本轮不回传。规则确定 → 历史字节稳定。
reasoning_passback = "tool_turns"
edit_style = "edit"
prompt_patch = "deepseek"
empty_assistant_content = "empty"
quirks = ["dsml_tool_calls", "json_tool_calls"]
# 推理强度：思考默认开启、默认强度 high；服务端只区分 low / high / max（medium 映射到 high）。
# ee 的 低 / 中 / 高 → low / high / max；关闭思考 → extra_body {"thinking": {"type": "disabled"}}
effort_param = "reasoning_effort"
thinking_param = "thinking_type"
effort_values = { low = "low", medium = "high", high = "max" }

[price]
currency = "¥"
input = 2.0
output = 8.0
cache_read = 0.04

# deepseek-v4-pro：命中 0.30 / 未命中 9 / 输出 27 元每百万 token
[[variants]]
match = ["deepseek-v4-pro", "deepseek-pro"]
vision = false

[variants.price]
input = 9.0
output = 27.0
cache_read = 0.30
