family = "doubao"
match = ["doubao", "seed-", "ark-"]
context_window = 131072
max_output = 16384
parallel_tools = true
vision = false
reasoning = true
reasoning_passback = "none"
edit_style = "edit"
prompt_patch = "default"
empty_assistant_content = "empty"
quirks = ["json_tool_calls"]
# 思考开关与推理强度（官方文档 https://ark.volcengine.com/region:cn-beijing/docs/model-parameter-support，2026-11 查阅）：
# - thinking.type = enabled / disabled / auto。
# - reasoning_effort 默认 high，有效档位 low / medium / high；minimal 表示停止思考，
#   none 映射成 minimal，xhigh / max 映射成 high（所以这三个不是独立档位）。
# 因此只给 low / medium / high 三档；ee 的「最高」由 canonical 自动落到 high。
# 这些参数只有 Seed 2.1 / 2.0 及 doubao-seed-evolving 支持，老版本不认——
# 发了会 400，openai_chat 会去掉并记住。
thinking_param = "thinking_type"

[[variants]]
match = ["seed-2", "seed-evolving", "doubao-seed-2"]
effort_param = "reasoning_effort"
effort_levels = ["low", "medium", "high", "max"]
effort_values = { max = "high" }
# 豆包服务端把 xhigh/max 都映射成 high，所以「最高」与「高」发出去是同一个值：
# 文案要写明，别让用户以为从「高」切到「最高」升了一级。
effort_labels = { max = "最高（等同 high）" }
