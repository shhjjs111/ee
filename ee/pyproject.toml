[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ee-agent"
version = "0.1.0"
description = "ee：个人 AI 编程 agent 的内核与桌面端后端（OpenAI Chat Completions 协议，多模型通用）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40",
  "websockets>=13.0",
  "httpx>=0.27",        # web_search / web_fetch（新版 openai 改用 httpx2，不再顺带装 httpx）
  "pypdf>=4.0",         # read 工具读 PDF（D4-7）
  "python-docx>=1.1",   # 读 Word .docx
  "openpyxl>=3.1",      # 读 Excel .xlsx
  "python-pptx>=0.6.23",# 读 PowerPoint .pptx
  # 仓库地图（D5-6）：0.13.0 是最后一个把语言库预编译进 wheel 的版本（1.x 改为运行时联网下载），固定它
  "tree-sitter>=0.25.2",
  "tree-sitter-language-pack==0.13.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
ee = "ee.cli:main"

[tool.setuptools.packages.find]
include = ["ee*"]

[tool.setuptools.package-data]
"ee" = ["prompts/*.md", "prompts/system/*.md", "prompts/tools/*.md", "core/providers/profiles/*.toml", "core/builtin_prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
