[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ee-agent"
version = "0.1.0"
description = "ee：个人 AI 编程 agent 的内核与桌面端后端（OpenAI Chat Completions 协议，多模型通用）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # 上界只为挡住跨大版本的静默破坏：CI 每次全新装依赖，没上界时上游发个大版本就可能
  # 一夜变红，而且报错往往看起来像我们自己的 bug。上界按当前已验证的主版本给，
  # 升级时把上界一起抬——不要把版本钉死（补丁版本没人天天跟）。
  "openai>=1.40,<4",
  "websockets>=13.0,<18",
  "httpx>=0.27,<1",     # web_search / web_fetch（新版 openai 改用 httpx2，不再顺带装 httpx）
  "pypdf>=4.0,<7",      # read 工具读 PDF（D4-7）
  "python-docx>=1.1,<2",   # 读 Word .docx
  "openpyxl>=3.1,<4",      # 读 Excel .xlsx
  "python-pptx>=0.6.23,<2", # 读 PowerPoint .pptx
  # 仓库地图（D5-6）：0.13.0 是最后一个把语言库预编译进 wheel 的版本（1.x 改为运行时联网下载），固定它
  "tree-sitter>=0.25.2,<0.27",
  "tree-sitter-language-pack==0.13.0",
]

[project.optional-dependencies]
test = ["pytest>=7,<10"]

[project.scripts]
ee = "ee.cli:main"

[tool.setuptools.packages.find]
include = ["ee*"]

[tool.setuptools.package-data]
"ee" = ["prompts/*.md", "prompts/system/*.md", "prompts/tools/*.md", "prompts/styles/*.md", "core/providers/profiles/*.toml", "core/builtin_prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# 静态检查只跑「真正的错误」类规则（E9 语法、F63/F7 断言与调试、F82 未定义名、
# F401 未用导入、F811 重定义、F841 未用变量）。不做风格强制：仓库的排版约定是
# 人写的（中文注释、对齐的参数表），formatter 会把它们打散。
# 进 CI 的门只跑这一组：它是「代码有误」的硬指标，可以零容忍。
# 必须先有 [tool.ruff] 表：没有这个表，ruff 不会把 pyproject.toml 当配置文件。
[tool.ruff]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]

